    <script>


        /**
         * Gets nodes along a GeoJSON LineString at regular intervals.
         *
         * @param {object} lineStringGeoJSON - GeoJSON LineString object.
         * @param {number} interval - Desired interval between nodes in meters.
         * @returns {Array<Array<number>>} Array of [longitude, latitude] coordinates.
         */
        function getNodesAlongWay(lineStringGeoJSON, interval) {
            if (!lineStringGeoJSON || lineStringGeoJSON.type !== 'LineString' || !lineStringGeoJSON.coordinates) {
                throw new Error('Invalid GeoJSON LineString object.');
            }

            var coordinates = lineStringGeoJSON.coordinates;
            var result = [];
            let accumulatedDistance = 0;

            if (coordinates.length < 2) {
                return coordinates; // Return original if it has less than two points.
            }

            result.push(coordinates[0]); // Add the first coordinate.

            for (let i = 0; i < coordinates.length - 1; i++) {
                var start = coordinates[i];
                var end = coordinates[i + 1];
                var segmentDistance = calculateDistance(start, end);
                if (segmentDistance > 10000) {
                    console.log("segmentDistance", segmentDistance);
                    console.log("start", start);
                    console.log("end", end);
                    console.log("i", i);
                    console.log("coordinates", coordinates);
                    // skip this for iteration
                    continue;
                }
                let remainingSegmentDistance = segmentDistance;

                while (accumulatedDistance + remainingSegmentDistance >= interval) {
                var distanceToNextNode = interval - accumulatedDistance;
                var fraction = distanceToNextNode / segmentDistance;

                var newNode = interpolate(start, end, fraction);
                result.push(newNode);
                accumulatedDistance = 0;
                remainingSegmentDistance -= distanceToNextNode;
                start = newNode; // update start for the next iteration.
                segmentDistance = calculateDistance(start, end);

                }

                accumulatedDistance += remainingSegmentDistance;
            }

            if (result.length>0 && result[result.length-1][0] !== coordinates[coordinates.length-1][0] || result[result.length-1][1] !== coordinates[coordinates.length-1][1])
            {
                result.push(coordinates[coordinates.length-1]); // ensures the last coordinate is included.
            }

            return result;
        }


        /**
         * Calculates the distance between two coordinates in meters using the Haversine formula.
         *
         * @param {Array<number>} coord1 - [longitude, latitude] of the first coordinate.
         * @param {Array<number>} coord2 - [longitude, latitude] of the second coordinate.
         * @returns {number} Distance in meters.
         */
        function calculateDistance(coord1, coord2) {
        var [lon1, lat1] = coord1.map(degToRad);
        var [lon2, lat2] = coord2.map(degToRad);

        var dLat = lat2 - lat1;
        var dLon = lon2 - lon1;

        var a =
            Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1) * Math.cos(lat2) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);

        var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

        var earthRadius = 6371000; // Radius of the Earth in meters
        return earthRadius * c;
        }

        /**
         * Converts degrees to radians.
         *
         * @param {number} degrees - Degrees to convert.
         * @returns {number} Radians.
         */
        function degToRad(degrees) {
        return degrees * (Math.PI / 180);
        }

        
        /**
         * Interpolates between two coordinates based on a fraction.
         *
         * @param {Array<number>} coord1 - [longitude, latitude] of the first coordinate.
         * @param {Array<number>} coord2 - [longitude, latitude] of the second coordinate.
         * @param {number} fraction - Fraction between 0 and 1.
         * @returns {Array<number>} Interpolated coordinate.
         */
        function interpolate(coord1, coord2, fraction) {
        var lon = coord1[0] + (coord2[0] - coord1[0]) * fraction;
        var lat = coord1[1] + (coord2[1] - coord1[1]) * fraction;
        return [lon, lat];
        }

        function convertGeoJSON() {
            var fileInput = document.getElementById('fileInput');

            if (fileInput.files.length === 0) {
                alert('Please select a GeoJSON file.');
                return;
            }

            var file = fileInput.files[0];
            var reader = new FileReader();

            reader.onload = function(event) {
                var geojson = JSON.parse(event.target.result);
                var convertedData = {
                    name: file.name.split(".")[0],
                    customCoordinates: []
                };

                let locId = 0;

                geojson.features.forEach(feature => {
                    console.log(feature)
                    let errors = [];
                    var type = feature.geometry.type;
                    let coordinates = [];
                    try{
                        switch (type) {
                        case 'Polygon':
                            coordinates = feature.geometry.coordinates[0];
                            break;
                        case 'LineString':
                            let coordinates_first_level_line = feature.geometry.coordinates;
                            // remove where is empty
                            coordinates_first_level_line = coordinates_first_level_line.filter(x => x.length > 0);
                            coordinates = coordinates_first_level_line;
                            if (coordinates.length === 0 || coordinates === undefined) {
                                errors.push("empty coordinates");
                                coordinates = [0, 0];
                            }
                            break;
                        case 'MultiPolygon':
                            for (let i = 0; i < feature.geometry.coordinates.length; i++) {
                                let coordinates_2 = feature.geometry.coordinates[i];
                                console.log("coordinates_2", coordinates_2);
                                coordinates_2.forEach(coordinate_2 => {
                                    console.log("coordinate_2", coordinate_2);
                                    coordinate_2.forEach(coordinate_3 => {
                                        //console.log("coordinate_3", coordinate_3);
                                        coordinates.push(coordinate_3);
                                    });
                                });
                                
                            }
                            break;
                        case 'MultiLineString':
                            let coordinates_first_level = feature.geometry.coordinates;
                            // remove where is empty
                            coordinates_first_level = coordinates_first_level.filter(x => x.length > 0);
                            let coordinates_second_level = coordinates_first_level[0];
                            // remove where is empty
                            coordinates_second_level = coordinates_second_level.filter(x => x.length > 0);
                            coordinates = coordinates_second_level;
                            break;
                        default:
                            console.error('Unknown type:', type);
                            return;
                        }
                    } catch (e) {
                        console.log(e);
                        console.log(feature)
                        errors.push("coordinates issue");
                        coordinates = [0, 0];
                    }
                    if (coordinates.length === 0) {
                        console.log(feature)
                        errors.push("empty coordinates");
                        coordinates = [0, 0];
                    }
                    
                    let out_tags = [type];
                    let interval = document.getElementById('interval').value;
                    // interval as int
                    interval = parseInt(interval);

                    if (interval > 0) {
                        let nodes = getNodesAlongWay({type: 'LineString', coordinates: coordinates}, interval);
                        nodes.forEach(node => {
                            convertedData.customCoordinates.push({
                                lat: node[1],
                                lng: node[0],
                                extra: {
                                    tags: out_tags,
                                    id: locId++
                                }
                            });
                        });
                    } else {
                        if (errors.length > 0) {
                            out_tags.push(`errors: ${errors.join(", ")}`);
                        }
                        convertedData.customCoordinates.push({
                            lat: coordinates[1],
                            lng: coordinates[0],
                            extra: {
                                tags: out_tags,
                                id: locId++
                            }
                        });
                    }
                });



                var blob = new Blob([JSON.stringify(convertedData, null, 4)], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = `${file.name.split(".")[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                document.getElementById('result').innerText = `File ${file.name} converted successfully.`;
            };

            reader.readAsText(file);
        }
    </script>
